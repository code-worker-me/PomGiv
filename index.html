<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; media-src 'self' data: blob:" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; media-src 'self' data: blob:" />
    <title>Pomodoro Focus Timer</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <button class="settings-toggle-btn" id="settings-toggle-btn" title="Pengaturan Timer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
        <!--Analytic button-->

        <!-- Main Timer Card -->
        <div class="glass-card">

            <div class="modes-container">
                <button class="mode-btn active" id="mode-work" data-mode="work">Pomodoro</button>
                <button class="mode-btn" id="mode-short" data-mode="short">Short Break</button>
                <button class="mode-btn" id="mode-long" data-mode="long">Long Break</button>
            </div>

            <div class="session-container" id="session-container">
                <div class="session-info">
                    <span class="session-label" id="session-display">Session 1 of 4</span>
                </div>
                <div class="session-dots" id="session-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <div class="timer-circle-container">
                <svg class="timer-svg" viewBox="0 0 260 260">
                    <circle class="timer-track" cx="130" cy="130" r="120"></circle>
                    <circle class="timer-progress" id="timer-progress" cx="130" cy="130" r="120"></circle>
                </svg>
                <div class="timer-time-display">
                    <span class="time" id="time-display">25:00</span>
                    <span class="status-text" id="status-display">Focusing</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn btn-secondary" id="reset-btn" title="Reset Timer">
                    <!-- Reset Icon (SVG) -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M16 3h5v5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 21H3v-5"></path></svg>
                </button>
                <button class="control-btn btn-play" id="play-btn" title="Start/Pause">
                    <!-- Play Icon (SVG) -->
                    <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
                <button class="control-btn btn-secondary" id="skip-btn" title="Skip Session">
                    <!-- Skip Icon (SVG) -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8V4z"></path><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                </button>
            </div>
        </div>

        <!-- Task List Card -->
        <div class="task-section">
            <h2>Focus Tasks</h2>
            <div class="task-input-container">
                <input type="text" id="task-input" class="task-input" placeholder="What are you working on?" maxlength="50" />
                <button id="add-task-btn" class="btn-add-task">Add</button>
            </div>
            <ul id="task-list" class="task-list">
                <!-- Tasks will be dynamically populated -->
            </ul>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay hidden" id="settings-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="btn-close-modal" id="close-settings-btn" title="Close">&times;</button>
            </div>
            <div class="settings-nav-tabs">
                <button class="nav-tab-btn active" id="tab-btn-timer">Timer</button>
                <button class="nav-tab-btn" id="tab-btn-notification">Notifikasi</button>
            </div>
            <div class="modal-body">
                <!-- Tab 1: Timer Settings -->
                <div class="settings-tab-content" id="settings-tab-timer">
                    <div class="setting-group">
                        <div class="setting-label-row">
                            <label for="work-duration-input">Waktu Belajar (Fokus)</label>
                            <span class="setting-val-badge" id="work-val-display">25 min</span>
                        </div>
                        <input type="range" id="work-duration-input" class="setting-range" min="5" max="60" value="25" step="1" />
                        <div class="range-limits"><span>5m</span><span>60m</span></div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label-row">
                            <label for="short-duration-input">Istirahat Pendek (Short Break)</label>
                            <span class="setting-val-badge" id="short-val-display">5 min</span>
                        </div>
                        <input type="range" id="short-duration-input" class="setting-range" min="1" max="15" value="5" step="1" />
                        <div class="range-limits"><span>1m</span><span>15m</span></div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label-row">
                            <label for="long-duration-input">Istirahat Panjang (Long Break)</label>
                            <span class="setting-val-badge" id="long-val-display">15 min</span>
                        </div>
                        <input type="range" id="long-duration-input" class="setting-range" min="5" max="60" value="15" step="1" />
                        <div class="range-limits"><span>5m</span><span>60m</span></div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label-row">
                            <label for="total-sessions-input">Jumlah Sesi Pomodoro</label>
                            <span class="setting-val-badge" id="sessions-val-display">4 sesi</span>
                        </div>
                        <input type="range" id="total-sessions-input" class="setting-range" min="1" max="8" value="4" step="1" />
                        <div class="range-limits"><span>1 sesi</span><span>8 sesi</span></div>
                    </div>
                </div>

                <!-- Tab 2: Notification Settings -->
                <div class="settings-tab-content hidden" id="settings-tab-notification">
                    <div class="setting-group">
                        <div class="setting-label-row">
                            <label for="sound-duration-input">Lama Notifikasi Berbunyi</label>
                            <span class="setting-val-badge" id="sound-duration-val-display">3 detik</span>
                        </div>
                        <input type="range" id="sound-duration-input" class="setting-range" min="1" max="15" value="3" step="1" />
                        <div class="range-limits"><span>1s</span><span>15s</span></div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label-row">
                            <label for="sound-select">Suara Notifikasi</label>
                            <div class="sound-action-btns">
                                <button type="button" class="btn-test-sound" id="btn-test-sound" title="Test Suara">
                                    &#9654; Test
                                </button>
                                <button type="button" class="btn-delete-sound hidden" id="btn-delete-sound" title="Hapus MP3 Ini">
                                    &#128465; Hapus MP3
                                </button>
                            </div>
                        </div>
                        <select id="sound-select" class="setting-select">
                            <option value="chime">Synthesized Chime (Default)</option>
                            <option value="digital">Digital Beep</option>
                            <option value="gentle">Gentle Bell</option>
                        </select>
                    </div>

                    <div class="setting-group setting-toggle-row">
                        <label for="sound-repeat-toggle">Ulangi Suara (Repeat Notification)</label>
                        <input type="checkbox" id="sound-repeat-toggle" class="setting-checkbox" />
                    </div>

                    <div class="setting-group">
                        <div class="setting-label-row">
                            <label>Upload Suara MP3 Baru</label>
                        </div>
                        <div class="upload-mp3-box">
                            <input type="file" id="mp3-file-input" accept=".mp3,audio/mpeg,audio/mp3,audio/*" style="display: none;" />
                            <button type="button" class="btn-upload-mp3" id="btn-trigger-upload">+ Pilih File MP3</button>
                            <span class="upload-filename" id="upload-filename">Belum ada file dipilih</span>
                        </div>
                    </div>

                    <div class="setting-group" id="custom-sounds-group">
                        <div class="setting-label-row">
                            <label>Daftar File MP3 Tersimpan</label>
                        </div>
                        <div id="custom-sounds-list" class="custom-sounds-list"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-save-settings" id="save-settings-btn">Simpan Pengaturan</button>
            </div>
        </div>
    </div>

    <!-- Task Session Modal -->
    <div class="modal-overlay hidden" id="task-session-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Pilih Sesi Task</h3>
                <button class="btn-close-modal" id="close-task-session-btn" title="Batal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="task-modal-subtitle" id="task-modal-preview">Pilih sesi untuk mengerjakan task ini:</p>
                <div class="session-checkboxes-container" id="session-checkboxes-container">
                    <!-- Session options dynamically populated -->
                </div>
            </div>
            <div class="modal-footer modal-footer-actions">
                <button class="btn-modal-cancel" id="cancel-task-session-btn">Batal</button>
                <button class="btn-save-settings" id="confirm-add-task-btn">Tambah Task</button>
            </div>
        </div>
    </div>

    <!-- Task Verification Modal -->
    <div class="modal-overlay hidden" id="task-verify-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Verifikasi Task Sesi <span id="verify-session-num">1</span></h3>
                <button class="btn-close-modal" id="close-verify-modal-btn" title="Tutup">&times;</button>
            </div>
            <div class="modal-body">
                <p class="task-modal-subtitle" id="verify-modal-subtitle">Sesi selesai! Apakah task di bawah ini sudah selesai?</p>
                <div class="task-verify-list" id="task-verify-list">
                    <!-- Dynamic task verification items -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-save-settings" id="save-verify-btn">Simpan & Lanjutkan</button>
            </div>
        </div>
    </div>
</body>
<script src="./db.js"></script>
<script src="./renderer.js"></script>

</html>
